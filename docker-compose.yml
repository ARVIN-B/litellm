version: "1"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm

    env_file:
      - .env
    
    environment:
      PYTHONPATH: /app

    ports:
      - "100.99.149.108:4000:4000"

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./generated_models.yaml:/app/generated_models.yaml:ro
      - ./generated_router.yaml:/app/generated_router.yaml:ro
      - ./custom_callbacks.py:/app/custom_callbacks.py:ro

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"

    restart: unless-stopped
